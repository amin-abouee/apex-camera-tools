[package]
name = "camera-tools"
version = "0.4.1"
edition = "2024"
authors = ["Amin Abouee"]
description = "A CLI application for fisheye and wide-angle camera model conversion and image undistortion"
license = "MIT"
readme = "README.md"
exclude = [
    "logs/*",
    "output/*",
    "target/*",
    ".github/*"
]

[lib]
name = "camera_tools"
path = "src/lib.rs"

[[bin]]
name = "converter"
path = "bin/converter.rs"

[[bin]]
name = "undistort"
path = "bin/undistort.rs"

[dependencies]
# Core dependencies
nalgebra = "0.33.2"
apex-solver = "1.2.1"
apex-camera-models = "0.1.0"
thiserror = "2.0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
yaml-rust = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Image processing
image = "0.25.2"
csv = "1.3.1"

# CLI
clap = { version = "4.5.38", features = ["derive"] }

[dev-dependencies]
approx = "0.5.1"
flexi_logger = "0.30"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
